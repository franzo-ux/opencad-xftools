name: Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            library: opencad_point_numbering.dll
            asset: opencad.point_numbering-windows-x86_64.dll
          # OpenCADStudio publishes Apple Silicon desktop builds.
          - os: macos-14
            library: libopencad_point_numbering.dylib
            asset: opencad.point_numbering-macos-aarch64.dylib
          - os: ubuntu-latest
            library: libopencad_point_numbering.so
            asset: opencad.point_numbering-linux-x86_64.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo test
      - run: cargo build --release
      - name: Stage release files
        shell: bash
        run: |
          mkdir dist
          cp "target/release/${{ matrix.library }}" "dist/${{ matrix.asset }}"
          cp plugin.toml dist/plugin.toml
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/plugin.toml
